services:
  postgres:
    image: postgres:16-alpine
    container_name: govropk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-govropk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-govropk_pass}
      POSTGRES_DB: ${POSTGRES_DB:-govropk}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-govropk}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mcp-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: govropk_mcp_server
    restart: unless-stopped
    command: ["python", "-m", "app.mcp.server"]
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "8765:8765"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: govropk_backend
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MCP_SERVER_URL: http://mcp-server:8765
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      mcp-server:
        condition: service_started
    ports:
      - "8010:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: govropk_frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
       - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
