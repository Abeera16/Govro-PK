services:
  postgres:
    image: postgres:16-alpine
    container_name: civicai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-civicai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civicai_pass}
      POSTGRES_DB: ${POSTGRES_DB:-civicai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-civicai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  chromadb:
    image: chromadb/chroma:0.5.23
    container_name: civicai_chromadb
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"

  mcp-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civicai_mcp_server
    restart: unless-stopped
    command: ["python", "-m", "app.mcp.server"]
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
    depends_on:
      - chromadb
    ports:
      - "8765:8765"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civicai_backend
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      MCP_SERVER_URL: http://mcp-server:8765
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
      mcp-server:
        condition: service_started
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: civicai_frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
       - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  chroma_data:
